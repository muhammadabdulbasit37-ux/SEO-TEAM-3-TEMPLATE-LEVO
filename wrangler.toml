# Cloudflare Workers + static assets. The dashboard deploy command is
# `npx wrangler deploy`, which runs the build below first.
name = "eftcheat-net"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[build]
command = "npm run build"

[[routes]]
pattern = "eftcheat.net"
custom_domain = true

[[routes]]
pattern = "www.eftcheat.net"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true
